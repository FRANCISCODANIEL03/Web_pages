<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>

<body>
    <form class="login-box_2">
        <h2>REGISTER</h2>
        <div class="input-box_2">
            <input type="text" id="nombre" placeholder="Pablo">
            <label>NOMBRE</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="ape1" placeholder="Gonzalez">
            <label>APELLIDO 1</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="ape2" placeholder="Jimenez">
            <label>APELLIDO 2</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="email" placeholder="pablo@gmail.com">
            <label>EMAIL</label>
        </div>
        <div class="input-box_2 password">
            <input type="password" id="password" placeholder="****">
            <label>CONTRASEÑA</label>
            <button type="button" id="togglePassword" class="toggle-password hidden">
                <i class="bi bi-eye-slash" id="iconPassword"></i>
            </button>
        </div>
        <div class="input-box_2 password">
            <input type="password" id="confirm-pass" placeholder="****">
            <label>CONFIRMAR CONTRASEÑA</label>
            <button type="button" id="togglePassword2" class="toggle-password hidden">
                <i class="bi bi-eye-slash" id="iconPassword2"></i>
            </button>
        </div>
        <button class="btn" id="reg" type="button">Register</button>
        <div class="signup-link">
            <a href="index.html">Login</a>
        </div>
    </form>
    <script src="register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
</body>

</html>
