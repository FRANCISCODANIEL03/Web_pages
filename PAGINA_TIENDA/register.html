<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>
<body>
    <form class="login-box_2">
        <h2>REGISTER</h2>
        <div class="input-box_2">
            <input type="text" id="nombre" placeholder="">
            <label>NOMBRE</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="ape1" placeholder="">
            <label>APELLIDO 1</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="ape2" placeholder="">
            <label>APELLIDO 2</label>
        </div>
        <div class="input-box_2">
            <input type="text" id="fecha_nac" placeholder="año-mes-dia">
            <label>FECHA DE NACIMIENTO</label>
        </div>
        <button class="btn" id="reg" type="button">Register</button>
        <div class="signup-link">
            <a href="index.html">Login</a>
         </div>
    </form>
    <script src="register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
