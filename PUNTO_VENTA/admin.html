<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="styles-admin.css">
    <title>ADMINISTRADOR</title>
</head>
<body>
    <header>
        <div class="navbar">
            <h2 id="client">ADMINISTRADOR</h2>
            <button id="cart-button">Recursos</button>
            <button id="verProductosBtn">Ver reporte</button>
        </div>
    </header>

    <div id="modalProductos" class="modal hidden">
        <div class="modal-content">
            <button id="cerrarModalBtn">✖</button>
            <h2>Inventario de productos</h2>
            <div id="contenedorProductos"></div>
        </div>
    </div>
    
    <main>
        <div class="content">
            <div class="options">
                <h2 id="name"></h2>
                <h3>Operaciones Disponibles</h3>
                <h4 id="msg">Selecciona un recurso</h4>
                <button id="search" class="animated-hidden">Buscar</button>
                <button id="insert" class="animated-hidden">Insertar</button>
                <button id="update" class="animated-hidden">Actualizar</button>
                <button id="delete" class="animated-hidden">Eliminar</button>      
            </div>

            <div class="campos">
                <h2 id="opera" style="display: none;"></h2>
                <h3>CAMPOS</h3>
                <h4 id="msg2">Selecciona una operacion</h4>
                <div class="input-box_2" id="did" style="display: none;">
                    <input type="number" id="id" placeholder="">
                    <label>ID</label>
                </div>
                <div class="input-box_2" id="didp" style="display: none;">
                    <input type="number" id="idp" placeholder="">
                    <label>ID</label>
                </div>
                <div class="input-box_2" id="dnombre" style="display: none;">
                    <input type="text" id="nombre" placeholder="">
                    <label>NOMBRE</label>
                </div>
                <div class="input-box_2" id="dape1" style="display: none;">
                    <input type="text" id="ape1" placeholder="">
                    <label>APELLIDO 1</label>
                </div>
                <div class="input-box_2" id="dape2" style="display: none;">
                    <input type="text" id="ape2" placeholder="">
                    <label>APELLIDO 2</label>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
