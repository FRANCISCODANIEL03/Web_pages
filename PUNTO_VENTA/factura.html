<button id="downloadBtn">Descargar documento</button>

<script>
document.getElementById("downloadBtn").addEventListener("click", () => {
    const tokenA = localStorage.getItem("token");
  fetch("https://api-tienda-don-pepe.onrender.com/api/v1/facturas/generate/2", {
    method: "GET",
    headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${tokenA}`
            }
  })
  .then(response => {
    if (!response.ok) throw new Error("Error al descargar el archivo");
    return response.blob(); // Obtener la respuesta como blob
  })
  .then(blob => {
    const url = window.URL.createObjectURL(blob); // Crear una URL temporal
    const a = document.createElement("a");
    a.href = url;
    a.download = "documento.pdf"; // Cambia el nombre y extensión si es necesario
    document.body.appendChild(a);
    a.click(); // Simula clic para iniciar descarga
    a.remove(); // Limpia
    window.URL.revokeObjectURL(url); // Libera memoria
  })
  .catch(err => {
    console.error("Hubo un error:", err);
  });
});
</script>
