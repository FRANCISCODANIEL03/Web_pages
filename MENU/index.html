<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="sidebar" class="container-sidebar">
            <ul class="menu-group">
                <li onclick="changeActive(0)" class="active">
                    <a href="#"><i class="fas fas-home"></i>Home</a>
                </li>
                <li onclick="changeActive(1)">
                    <a href="#"><i class="far fa-question-circle"></i>About</a>
                </li>
                <li onclick="changeActive(2)">
                    <a href="#"><i class="fas fa-calendar-alt"></i>Events</a>
                </li>
                <li onclick="changeActive(3)">
                    <a href="#"><i class="fas fa-sliders-h"></i>Services</a>
                </li>
                <li onclick="changeActive(4)">
                    <a href="#"><i class="far fa-envelope"></i>Contact</a>
                </li>
            </ul>
            <ul class="menu-theme">
                <li>
                    <i id="dark-mode" class="fas fa-moon"></i>
                </li>
                <li>
                    <i id="ligth-mode" class="fas fa-sun"></i>
                </li>
            </ul>
            <div class="time-wrapper">
                <span class="time-show" id="time"></span>
            </div>
        </div>
        <div id="btns-group" class="menu-btn">
            <i id="btn-close" class="fa fa-times"></i>
            <i id="btn-open" class="fas fa-bars"></i>
        </div>
    </div>
</body>
</html>
